name: Windows Single EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - ".github/**"
      - "README.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-single-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Verify single-file executable
        shell: pwsh
        run: |
          $exe = "target/release/mac-address-manager.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Release executable was not produced."
          }
          $dependencies = (& dumpbin /dependents $exe | Out-String)
          Write-Host $dependencies
          if ($dependencies -match 'WebView2Loader\.dll') {
            throw "The executable still imports WebView2Loader.dll and is not single-file."
          }
          if (Test-Path -LiteralPath "target/release/WebView2Loader.dll") {
            throw "An unexpected WebView2Loader.dll was produced in the release directory."
          }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath $exe -Destination dist/mac-address-manager.exe
          Get-Item -LiteralPath dist/mac-address-manager.exe | Select-Object Name, Length

      - name: Upload single EXE
        uses: actions/upload-artifact@v4
        with:
          name: mac-address-manager-windows-x64
          path: dist/mac-address-manager.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download single EXE
        uses: actions/download-artifact@v4
        with:
          name: mac-address-manager-windows-x64
          path: release

      - name: Prepare release files
        shell: bash
        run: |
          set -e
          mv release/mac-address-manager.exe "release/MAC-Address-Manager-${GITHUB_REF_NAME}.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: MAC地址管理器_${{ github.ref_name }}
          files: release/MAC-Address-Manager-${{ github.ref_name }}.exe
          fail_on_unmatched_files: true
          body: |
            Windows 10/11 x64 单文件版。GitHub Releases 不支持中文资源文件名；资源显示名称为 MAC地址管理器_版本号.exe，实际下载文件名为 MAC-Address-Manager-版本号.exe。支持地址方案一键应用、清空操作记录、托盘常驻、开机自启、地址漂移自动修复和 Wi-Fi 随机地址检测。

      - name: Set Chinese asset label
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset_id=$(gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" --jq '.assets[] | select(.name | endswith(".exe")) | .id' | head -n 1)
          if [ -n "$asset_id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/releases/assets/$asset_id" -f "label=MAC地址管理器_${{ github.ref_name }}.exe"
          fi
