name: Windows Single EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - ".github/**"
      - "README.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-single-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Verify single-file executable
        shell: pwsh
        run: |
          $exe = "target/release/mac-address-manager.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Release executable was not produced."
          }
          $dependencies = (& dumpbin /dependents $exe | Out-String)
          Write-Host $dependencies
          if ($dependencies -match 'WebView2Loader\.dll') {
            throw "The executable still imports WebView2Loader.dll and is not single-file."
          }
          if (Test-Path -LiteralPath "target/release/WebView2Loader.dll") {
            throw "An unexpected WebView2Loader.dll was produced in the release directory."
          }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath $exe -Destination dist/mac-address-manager.exe
          Get-Item -LiteralPath dist/mac-address-manager.exe | Select-Object Name, Length

      - name: Upload single EXE
        uses: actions/upload-artifact@v4
        with:
          name: mac-address-manager-windows-x64
          path: dist/mac-address-manager.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download single EXE
        uses: actions/download-artifact@v4
        with:
          name: mac-address-manager-windows-x64
          path: release

      - name: Prepare release files
        shell: bash
        run: |
          set -e
          mkdir -p release/package
          cp release/mac-address-manager.exe "release/package/MAC地址管理器-${GITHUB_REF_NAME}.exe"
          cp release/mac-address-manager.exe "release/MAC-Address-Manager-${GITHUB_REF_NAME}.exe"
          (cd release/package && zip -q "../MAC-Address-Manager-${GITHUB_REF_NAME}.zip" *.exe)
          rm -rf release/package release/mac-address-manager.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: MAC地址管理器 ${{ github.ref_name }}
          files: |
            release/MAC-Address-Manager-${{ github.ref_name }}.exe
            release/MAC-Address-Manager-${{ github.ref_name }}.zip
          fail_on_unmatched_files: true
          body: |
            ## 下载

            - `MAC-Address-Manager-版本号.exe`：Windows 10/11 x64 单文件版，可直接运行。
            - `MAC-Address-Manager-版本号.zip`：解压后得到中文文件名 `MAC地址管理器-版本号.exe`。

            GitHub Releases 会重写中文资源名，因此直接下载的 EXE 使用英文名；需要中文文件名时请使用 ZIP。

            ## 说明

            - 单个 EXE，不依赖旁加载的 `WebView2Loader.dll`。
            - 默认窗口 1000×700 居中，紧凑布局，页面无横向滚动条。
            - 侧栏权限状态更简洁，管理员状态下不再显示重复的提权按钮。
            - 关闭窗口后驻留系统托盘，可从托盘显示窗口或退出。
            - 支持开机自启，启动时驻留托盘；在设置中随时关闭。
            - 可选按网卡启用地址漂移自动修复；仅在程序运行期间生效。
            - 检测已保存 Wi-Fi 网络的随机硬件地址并提示，不修改系统设置。
            - 关于页包含版本号、GitHub 仓库和发行版入口。
            - 修改网卡需要管理员权限；部分 Intel Wi-Fi 驱动可能不支持任意 MAC。
            - 系统需 WebView2 Runtime；如提示缺少 `VCRUNTIME140.dll`，请安装 Microsoft Visual C++ 2015-2022 Redistributable（x64）。
